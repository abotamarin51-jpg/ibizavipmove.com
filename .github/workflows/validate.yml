name: Validate Ibiza VIP Move

on:
  pull_request:
    branches: [main]
    paths:
      - "premium_site.py"
      - "trust_enhance.py"
      - "international_pages.py"
      - "postprocess_site.py"
      - "legal_pages.py"
      - "authority_enhance.py"
      - "image_markup_enhance.py"
      - "upgrade_visual_assets.py"
      - "phase11_enhance.py"
      - "phase12_enhance.py"
      - "phase13_enhance.py"
      - "phase14_enhance.py"
      - "phase15_enhance.py"
      - "phase16_enhance.py"
      - "phase17_enhance.py"
      - "phase18_enhance.py"
      - "phase19_enhance.py"
      - "phase20_enhance.py"
      - "editorial-black.css"
      - "editorial-inner.css"
      - "submit_indexnow.py"
      - "validate_site.py"
      - "build_site.sh"
      - "premium.css"
      - "luxury-overrides.css"
      - "premium.js"
      - "brand-logo.jpg"
      - "brand-logo.svg"
      - "brand-mark.svg"
      - "favicon.svg"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build and validate website without deploying
        run: |
          bash build_site.sh
          python3 upgrade_visual_assets.py
          python3 phase11_enhance.py
          python3 phase12_enhance.py
          python3 phase13_enhance.py
          python3 phase14_enhance.py
          python3 phase16_enhance.py
          python3 phase15_enhance.py
          python3 phase17_enhance.py
          python3 phase18_enhance.py
          python3 phase19_enhance.py
          python3 phase20_enhance.py
          python3 validate_site.py
      - name: Upload validated preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: ibiza-vip-move-preview
          path: _site
          if-no-files-found: error
          retention-days: 3
