          python3 phase50_enhance.py
          python3 phase64_enhance.py
          python3 phase66_enhance.py
          python3 phase65_enhance.py
          python3 phase41_quality_gate.py
          python3 validate_site.py
          python3 phase75_faq_audit.py
          python3 phase129_enhance.py
          python3 phase130_enhance.py
          python3 phase130_audit.py
          python3 phase124_audit.py
          python3 phase71_audit.py
          python3 phase72_audit.py
          python3 phase67_final_audit.py
      - name: Upload validated preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: ibiza-vip-move-preview
          path: _site
          if-no-files-found: error
          retention-days: 3
