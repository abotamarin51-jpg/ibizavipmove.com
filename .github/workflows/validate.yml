name: Validate Ibiza VIP Move

on:
  pull_request:
    branches: [main]
    paths:
      - "phase*.py"
      - "phase*.css"
      - "phase*.js"
      - "premium_site.py"
      - "trust_enhance.py"
      - "international_pages.py"
      - "postprocess_site.py"
      - "legal_pages.py"
      - "authority_enhance.py"
      - "image_markup_enhance.py"
      - "upgrade_visual_assets.py"
      - "editorial-black.css"
      - "editorial-inner.css"
      - "editorial-multilingual.css"
      - "premium-motion.css"
      - "quintessentially-type.css"
      - "reference-home.css"
      - "submit_indexnow.py"
      - "validate_site.py"
      - "build_site.sh"
      - "premium.css"
      - "luxury-overrides.css"
      - "premium.js"
      - "brand-logo.jpg"
      - "brand-logo.svg"
      - "brand-mark.svg"
      - "favicon.svg"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build and validate website without deploying
        run: |
          bash build_site.sh
          python3 upgrade_visual_assets.py
          python3 phase11_enhance.py
          python3 phase12_enhance.py
          python3 phase13_enhance.py
          python3 phase14_enhance.py
          python3 phase16_enhance.py
          python3 phase15_enhance.py
          python3 phase17_enhance.py
          python3 phase18_enhance.py
          python3 phase19_enhance.py
          python3 phase20_enhance.py
          python3 phase21_enhance.py
          python3 phase22_enhance.py
          python3 phase23_enhance.py
          python3 phase24_enhance.py
          python3 phase25_enhance.py
          python3 phase26_enhance.py
          python3 phase27_enhance.py
          python3 phase28_enhance.py
          python3 phase29_enhance.py
          python3 phase30_enhance.py
          python3 phase31_enhance.py
          python3 phase32_enhance.py
          python3 phase33_enhance.py
          python3 phase34_enhance.py
          python3 phase35_enhance.py
          python3 phase36_enhance.py
          python3 phase37_enhance.py
          python3 phase38_enhance.py
          python3 phase39_enhance.py
          python3 phase40_enhance.py
          python3 phase44_enhance.py
          python3 phase51_enhance.py
          python3 phase51_accessibility_fix.py
          python3 phase51_metadata_fix.py
          python3 phase52_enhance.py
          python3 phase53_enhance.py
          python3 phase54_enhance.py
          python3 phase55_enhance.py
          python3 phase56_enhance.py
          python3 phase57_enhance.py
          python3 phase58_enhance.py
          python3 phase59_enhance.py
          python3 phase59_catalog_fix.py
          python3 phase60_enhance.py
          python3 phase61_enhance.py
          python3 phase62_enhance.py
          python3 phase63_enhance.py
          python3 phase68_enhance.py
          python3 phase71_enhance.py
          python3 phase71_metadata_fix.py
          python3 phase72_enhance.py
          python3 phase72_style_fix.py
          python3 phase73_enhance.py
          python3 phase42_enhance.py
          python3 phase43_enhance.py
          python3 phase45_enhance.py
          python3 phase46_enhance.py
          python3 phase47_enhance.py
          python3 phase74_style_fix.py
          python3 phase74_enhance.py
          python3 phase48_enhance.py
