name: Validate Ibiza VIP Move

on:
  pull_request:
    branches: [main]
    paths:
      - "premium_site.py"
      - "trust_enhance.py"
      - "international_pages.py"
      - "postprocess_site.py"
      - "legal_pages.py"
      - "authority_enhance.py"
      - "image_markup_enhance.py"
      - "validate_site.py"
      - "build_site.sh"
      - "premium.css"
      - "luxury-overrides.css"
      - "premium.js"
      - "brand-logo.jpg"
      - "brand-logo.svg"
      - "brand-mark.svg"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build and validate website without deploying
        run: bash build_site.sh
