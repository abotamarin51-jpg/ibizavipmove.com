name: Deploy Ibiza VIP Move

on:
  push:
    branches: [main]
    paths:
      - "premium_site.py"
      - "trust_enhance.py"
      - "international_pages.py"
      - "postprocess_site.py"
      - "legal_pages.py"
      - "authority_enhance.py"
      - "image_markup_enhance.py"
      - "upgrade_visual_assets.py"
      - "phase11_enhance.py"
      - "phase12_enhance.py"
      - "phase13_enhance.py"
      - "phase14_enhance.py"
      - "phase15_enhance.py"
      - "phase16_enhance.py"
      - "submit_indexnow.py"
      - "validate_site.py"
      - "build_site.sh"
      - "premium.css"
      - "luxury-overrides.css"
      - "premium.js"
      - "brand-logo.jpg"
      - "brand-logo.svg"
      - "brand-mark.svg"
      - "favicon.svg"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and validate website
        run: |
          bash build_site.sh
          python3 upgrade_visual_assets.py
          python3 phase11_enhance.py
          python3 phase12_enhance.py
          python3 phase13_enhance.py
          python3 phase14_enhance.py
          python3 phase16_enhance.py
          python3 phase15_enhance.py
          python3 validate_site.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify IndexNow
        if: success()
        run: python3 submit_indexnow.py
