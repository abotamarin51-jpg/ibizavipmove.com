name: Deploy Ibiza VIP Move

on:
  push:
    branches: [main]
    paths:
      - "premium_site.py"
      - "trust_enhance.py"
      - "international_pages.py"
      - "postprocess_site.py"
      - "legal_pages.py"
      - "authority_enhance.py"
      - "image_markup_enhance.py"
      - "upgrade_visual_assets.py"
      - "phase11_enhance.py"
      - "phase12_enhance.py"
      - "phase13_enhance.py"
      - "phase14_enhance.py"
      - "phase15_enhance.py"
      - "phase16_enhance.py"
      - "phase17_enhance.py"
      - "phase18_enhance.py"
      - "phase19_enhance.py"
      - "phase20_enhance.py"
      - "phase21_enhance.py"
      - "phase22_enhance.py"
      - "phase23_enhance.py"
      - "phase24_enhance.py"
      - "phase25_enhance.py"
      - "phase26_enhance.py"
      - "phase27_enhance.py"
      - "phase28_enhance.py"
      - "phase29_enhance.py"
      - "phase30_enhance.py"
      - "phase31_enhance.py"
      - "phase32_enhance.py"
      - "phase33_enhance.py"
      - "phase34_enhance.py"
      - "phase35_enhance.py"
      - "phase36_enhance.py"
      - "phase37_enhance.py"
      - "phase38_enhance.py"
      - "phase39_enhance.py"
      - "phase40_enhance.py"
      - "phase44_enhance.py"
      - "phase42_enhance.py"
      - "phase43_enhance.py"
      - "phase45_enhance.py"
      - "phase46_enhance.py"
      - "phase47_enhance.py"
      - "phase41_quality_gate.py"
      - "editorial-black.css"
      - "editorial-inner.css"
      - "editorial-multilingual.css"
      - "premium-motion.css"
      - "quintessentially-type.css"
      - "reference-home.css"
      - "phase29.css"
      - "phase30.css"
      - "phase31.css"
      - "phase32.css"
      - "phase33.css"
      - "phase35.css"
      - "phase38.css"
      - "phase40.css"
      - "phase42.css"
      - "phase43.css"
      - "phase45.css"
      - "phase46.js"
      - "submit_indexnow.py"
      - "validate_site.py"
      - "build_site.sh"
      - "premium.css"
      - "luxury-overrides.css"
      - "premium.js"
      - "brand-logo.jpg"
      - "brand-logo.svg"
      - "brand-mark.svg"
      - "favicon.svg"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and validate website
        run: |
          bash build_site.sh
          python3 upgrade_visual_assets.py
          python3 phase11_enhance.py
          python3 phase12_enhance.py
          python3 phase13_enhance.py
          python3 phase14_enhance.py
          python3 phase16_enhance.py
          python3 phase15_enhance.py
          python3 phase17_enhance.py
          python3 phase18_enhance.py
          python3 phase19_enhance.py
          python3 phase20_enhance.py
          python3 phase21_enhance.py
          python3 phase22_enhance.py
          python3 phase23_enhance.py
          python3 phase24_enhance.py
          python3 phase25_enhance.py
          python3 phase26_enhance.py
          python3 phase27_enhance.py
          python3 phase28_enhance.py
          python3 phase29_enhance.py
          python3 phase30_enhance.py
          python3 phase31_enhance.py
          python3 phase32_enhance.py
          python3 phase33_enhance.py
          python3 phase34_enhance.py
          python3 phase35_enhance.py
          python3 phase36_enhance.py
          python3 phase37_enhance.py
          python3 phase38_enhance.py
          python3 phase39_enhance.py
          python3 phase40_enhance.py
          python3 phase44_enhance.py
          python3 phase42_enhance.py
          python3 phase43_enhance.py
          python3 phase45_enhance.py
          python3 phase46_enhance.py
          python3 phase47_enhance.py
          python3 phase41_quality_gate.py
          python3 validate_site.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify IndexNow
        if: success()
        run: python3 submit_indexnow.py
