name: Deploy Ibiza VIP Move

on:
  push:
    branches: [main]
    paths:
      - "premium_site.py"
      - "premium.css"
      - "premium.js"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build premium Ibiza VIP Move website
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          python3 premium_site.py
          mkdir -p _site/assets
          cp premium.css _site/assets/premium.css
          cp premium.js _site/assets/premium.js
          test -f _site/index.html
          test -f _site/services/index.html
          test -f _site/contact/index.html
          test -f _site/sitemap.xml
          printf 'ibizavipmove.com\n' > _site/CNAME
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
