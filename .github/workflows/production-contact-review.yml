name: Review production WhatsApp without deploying

on:
  pull_request:
    branches: [main]
    paths:
      - "tests/production_whatsapp_review.py"
      - ".github/workflows/production-contact-review.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ivm-production-contact-review
  cancel-in-progress: false

jobs:
  read-only-browser-review:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out review code without storing credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the browser library version already used by this repository
        run: |
          python3 -m venv "$RUNNER_TEMP/ivm-production-review-tools"
          "$RUNNER_TEMP/ivm-production-review-tools/bin/python" -m pip install --disable-pip-version-check --only-binary=:all: "playwright==1.57.0"
      - name: Verify request allowlist without network
        run: |
          "$RUNNER_TEMP/ivm-production-review-tools/bin/python" tests/production_whatsapp_review.py --self-test
      - name: Capture the demonstrated Contact menu obstruction and already-requested resources
        run: |
          "$RUNNER_TEMP/ivm-production-review-tools/bin/python" tests/capture_contact_baseline.py
      - name: Inspect Home to Private Office to Contact without sending messages or Analytics
        run: |
          "$RUNNER_TEMP/ivm-production-review-tools/bin/python" tests/production_whatsapp_review.py --inline-crops --output "$RUNNER_TEMP/ivm-production-contact-review"
      - name: Retain screenshots and diagnostics outside website output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ibiza-vip-move-production-contact-review
          path: ${{ runner.temp }}/ivm-production-contact-review
          if-no-files-found: warn
          retention-days: 3
