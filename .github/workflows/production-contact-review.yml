name: Review WhatsApp contact journey

on:
  pull_request:
    branches: [main]
    paths:
      - "phase32.css"
      - "tests/production_whatsapp_review.py"
      - ".github/workflows/production-contact-review.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Ibiza VIP Move"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ivm-production-contact-review
  cancel-in-progress: false

jobs:
  browser-review:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out review code without storing credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Install the browser library version already used by this repository
        run: |
          python3 -m venv "$RUNNER_TEMP/ivm-production-review-tools"
          "$RUNNER_TEMP/ivm-production-review-tools/bin/python" -m pip install --disable-pip-version-check --only-binary=:all: "playwright==1.57.0"
      - name: Verify request allowlist without network
        run: |
          "$RUNNER_TEMP/ivm-production-review-tools/bin/python" tests/production_whatsapp_review.py --self-test
      - name: Test the exact candidate CSS before publication
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git show "$BASE_SHA:phase32.css" > "$RUNNER_TEMP/phase32-baseline.css"
          "$RUNNER_TEMP/ivm-production-review-tools/bin/python" tests/production_whatsapp_review.py --candidate-css phase32.css --baseline-css "$RUNNER_TEMP/phase32-baseline.css" --inline-crops --output "$RUNNER_TEMP/ivm-production-contact-review"
      - name: Verify unmodified production after deployment
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run'
        run: |
          "$RUNNER_TEMP/ivm-production-review-tools/bin/python" tests/production_whatsapp_review.py --inline-crops --output "$RUNNER_TEMP/ivm-production-contact-review"
      - name: Retain screenshots and diagnostics outside website output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ibiza-vip-move-production-contact-review
          path: ${{ runner.temp }}/ivm-production-contact-review
          if-no-files-found: warn
          retention-days: 3
